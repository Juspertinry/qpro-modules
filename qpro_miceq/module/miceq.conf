# qpro_miceq mic chain. Edited live; applies within a second.
enabled=1
# mics: which mics to sum (1=right 2=center 3=left)
mics=1,2,3
# echo cancellation against the speaker feed (adds ~40 ms latency)
aec=1
aec_tail_ms=64
aec_delay_ms=40
# RNNoise noise suppression, ns_mix 0..1 = strength
ns=1
ns_mix=1.0
# EQ bands: eqN=type,freq,gain_db,q  (types: hp lp ls hs pk notch)
eq1=hp,80,0,0.7
# gate: opens for a close-talking voice, drops people across the room.
# gate_db is on the pre-gain peak envelope; raise it (toward -40) if others
# still get through, lower it (toward -52) if your own quiet words get cut.
gate_db=-46
gate_hyst_db=4
gate_range_db=35
gate_hold_ms=250
# comp=threshold_db,ratio,attack_ms,release_ms,makeup_db
comp=-22,2.5,5,100,3
gain_db=10
limit_db=-1
dump=0
