# qpro_miceq preset: studio-style starting point. Tune by ear; edits apply live.
enabled=1
# all three mics summed (right, center, left)
mics=1,2,3
# echo cancel against the speakers; costs ~40 ms of latency, turn off if you
# don't use the headset speakers for voice chat
aec=1
aec_tail_ms=64
aec_delay_ms=40
# RNNoise; lower ns_mix for a more natural room tone (0.6-0.8)
ns=1
ns_mix=0.8
# EQ: rumble cut, a little body, tame the 3-5 kHz harshness, air on top
eq1=hp,70,0,0.7
eq2=ls,180,2,0.7
eq3=pk,3500,-3,1.5
eq4=pk,8500,-2,2
eq5=hs,10000,2,0.7
# gentle leveling: threshold_db,ratio,attack_ms,release_ms,makeup_db
comp=-22,2.5,5,90,6
gain_db=4
limit_db=-1
dump=0
debug=0
