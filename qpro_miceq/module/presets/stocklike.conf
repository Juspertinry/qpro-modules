# qpro_miceq preset: close to the stock C-Media output, measured against it.
# Stock = right+center mics, +11 dB, low cut below ~160 Hz, roll-off above 4 kHz,
# heavy noise suppression, echo cancel only in voice-chat mode.
enabled=1
mics=1,2
aec=1
aec_tail_ms=64
aec_delay_ms=40
ns=1
ns_mix=1.0
eq1=hp,120,0,0.7
eq2=ls,200,-3,0.7
eq3=hs,5000,-5,0.7
gain_db=11
limit_db=-1
dump=0
debug=0
